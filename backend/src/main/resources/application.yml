spring:
  application:
    name: edutrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edutrack}
    username: ${DB_USER:edutrack}
    password: ${DB_PASSWORD:edutrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-in-prod-please-use-a-long-random-secret-key-value-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

llm:
  provider: ${LLM_PROVIDER:ollama}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}

storage:
  base-path: ${STORAGE_BASE_PATH:./storage}

ocr:
  tessdata-path: ${OCR_TESSDATA_PATH:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

seed:
  enabled: ${SEED_ENABLED:true}

logging:
  level:
    com.edutrack: INFO
